name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # `mvn verify` compiles, runs the unit + integration test suite, and
      # packages the HPI. No -DskipTests here (that is only for the fast
      # release build); CI is where tests actually run.
      - name: Build and test (mvn verify)
        run: mvn -B verify
      - name: Upload HPI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hpi
          path: target/*.hpi
          if-no-files-found: error
