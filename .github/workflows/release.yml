name: release
on:
  push:
    tags:
      - 'v*.percona.*'

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        # tag v103.percona.27 -> changelist 103.percona.27 (no leading v)

      - name: Build HPI
        run: mvn -B -DskipTests package -Dchangelist=${{ steps.ver.outputs.version }}

      - name: Stage + checksum artifact
        id: asset
        run: |
          set -euo pipefail
          src="target/hetzner-cloud.hpi"
          out="hetzner-cloud-${{ steps.ver.outputs.version }}.hpi"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "hpi=$out" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ver.outputs.version }}
          files: |
            ${{ steps.asset.outputs.hpi }}
            ${{ steps.asset.outputs.hpi }}.sha256
